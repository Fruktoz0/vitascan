server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Böngésző → /api/* → backend (Docker service név: api)
  client_max_body_size 20m;

  # Teljes mentés feltöltése (DB + receptképek .tar.gz) — nagyobb body + hosszabb timeout
  location /api/admin/database/ {
    client_max_body_size 1024m;
    proxy_pass http://api:3005/api/admin/database/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
  }

  location /api/ {
    proxy_pass http://api:3005/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
  }

  location = /api {
    return 301 /api/;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
